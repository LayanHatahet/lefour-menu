<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Le Four — Tableau de bord photos</title>
  <link rel="icon" type="image/png" href="assets/logo_rollpin.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Manrope:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="ah">
    <img src="assets/logo_wordmark.png" alt="Le Four">
    <span class="ah-tag">Tableau de bord — photos</span>
    <button id="logout" class="mini" hidden>Sortir</button>
  </header>

  <!-- gate -->
  <section class="gate" id="gate">
    <h1>Accès réservé</h1>
    <p class="muted">Entrez le mot de passe administrateur.</p>
    <form id="gateForm">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Mot de passe" required>
      <button type="submit" class="solid">Entrer</button>
    </form>
    <p class="err" id="gateErr" hidden></p>
  </section>

  <!-- app -->
  <main id="app" hidden>
    <div class="notice" id="notice" hidden></div>

    <section class="block">
      <h2>Galerie du restaurant</h2>
      <p class="muted">Les photos de l’intérieur, affichées dans la section « Chez nous ».</p>
      <label class="drop" id="galDrop">
        <input type="file" accept="image/*" multiple hidden id="galInput">
        <span>+ Ajouter des photos</span>
      </label>
      <div class="gal" id="galList"></div>
    </section>

    <section class="block">
      <h2>Photos des plats</h2>
      <p class="muted">Une photo par plat. Elle apparaît sur la carte et dans la fiche du plat.</p>
      <div id="dishList"></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
